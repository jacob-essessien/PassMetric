[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Quieter output by default; pass -v on the command line for verbose runs.
addopts = -ra --tb=short

# Stop SQLAlchemy / Flask deprecation noise from drowning real failures
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
